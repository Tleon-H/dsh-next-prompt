# 每次推送或提交 PR 时，在 Node.js 22 与 24 上运行全部测试。
# 设置页表单的测试要用到开发依赖 @deepseek-ai/schemastery，所以先装依赖。
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
